apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 10m
  chart:
    spec:
      chart: homepage
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
      interval: 1h
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest

    env:
      HOMEPAGE_ALLOWED_HOSTS: homepage.dev-andrew.com


    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 3000

    ingress:
      main:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
        hosts:
          - host: homepage.dev-andrew.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: homepage-tls
            hosts:
              - homepage.dev-andrew.com

    config:
      settings:
        title: Andrew's Homelab
        theme: dark
        color: slate
        headerStyle: boxed

      services:
        - Infrastructure:
            - Proxmox:
                href: https://10.0.0.214:8006
                description: Virtualization host
            - OPNsense:
                href: https://192.168.50.1
                description: Homelab firewall/router
        - Monitoring:
            - Grafana:
                href: http://grafana.dev-andrew.com
                description: Kubernetes monitoring dashboard
                icon: grafana.png

      bookmarks:
        - DevOps:
            - GitHub:
                - abbr: GH
                  href: https://github.com/andyrosty
            - Kubernetes Docs:
                - abbr: K8s
                  href: https://kubernetes.io/docs/
