apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-test-data
  namespace: storage-test
  labels:
    app.kubernetes.io/name: storage-test
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
