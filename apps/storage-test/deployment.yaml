apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-test
  namespace: storage-test
  labels:
    app.kubernetes.io/name: storage-test
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-test
        app.kubernetes.io/part-of: homelab
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "storage-test started at $(date)" >> /data/test.log
              while true; do
                echo "storage-test heartbeat at $(date)" >> /data/test.log
                sleep 10
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-test-data
