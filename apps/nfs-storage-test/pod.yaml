apiVersion: v1
kind: Pod
metadata:
  name: nfs-writer-test
  namespace: nfs-storage-test
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "hello from kubernetes pod" > /downloads/k8s-pod-test.txt
          date >> /downloads/k8s-pod-test.txt
          cat /downloads/k8s-pod-test.txt
          sleep 3600
      volumeMounts:
        - name: downloads
          mountPath: /downloads
  volumes:
    - name: downloads
      persistentVolumeClaim:
        claimName: downloads-test-pvc
