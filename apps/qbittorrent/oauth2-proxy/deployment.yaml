apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-oauth2-proxy
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent-oauth2-proxy
  template:
    metadata:
      labels:
        app: qbittorrent-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.dev-andrew.com/realms/homelab
            - --client-id=qbittorrent
            - --redirect-url=https://qbittorrent.dev-andrew.com/oauth2/callback
            - --email-domain=*
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --session-cookie-minimal=true
            - --scope=openid email profile
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
