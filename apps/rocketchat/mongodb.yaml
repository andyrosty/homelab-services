apiVersion: v1
kind: Service
metadata:
  name: rocketchat-mongo
  namespace: rocketchat
spec:
  ports:
    - port: 27017
  clusterIP: None
  selector:
    app: rocketchat-mongo

---
apiVersion: v1
kind: StatefulSet
metadata:
  name: rocketchat-mongo
  namespace: rocketchat
spec:
  serviceName: "rocketchat-mongo"
  replicas: 1
  selector:
    matchLabels:
      app: rocketchat-mongo
  template:
    metadata:
      labels:
        app: rocketchat-mongo
    spec:
      containers:
        - name: mongodb
          image: docker.io/bitnami/mongodb:5.0
          env:
            - name: MONGODB_REPLICA_SET_MODE
              value: primary
            - name: MONGODB_REPLICA_SET_NAME
              value: rs0
            - name: MONGODB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat-db-secret
                  key: mongo-root-password
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /bitnami/mongodb
      volumeClaimTemplates:
        - metadata:
            name: mongodb-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 8Gi