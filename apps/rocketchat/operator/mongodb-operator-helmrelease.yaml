apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-kubernetes
  namespace: rocketchat
spec:
  interval: 30m

  chart:
    spec:
      chart: community-operator
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    operator:
      watchNamespace: rocketchat

    community-operator-crds:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
