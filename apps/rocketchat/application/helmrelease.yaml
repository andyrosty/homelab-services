apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rocketchat
  namespace: rocketchat

spec:
  interval: 30m

  chart:
    spec:
      chart: rocketchat
      sourceRef:
        kind: HelmRepository
        name: rocketchat
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    replicaCount: 1

    mongodb:
      enabled: false

    existingMongodbSecret: rocketchat-mongodb-connection

    host: rocketchat.dev-andrew.com

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    nodeSelector:
      workload: applications

    ingress:
      enabled: true
      ingressClassName: nginx
      path: /
      pathType: Prefix
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      tls:
        - secretName: rocketchat-tls
          hosts:
            - rocketchat.dev-andrew.com

    service:
      type: ClusterIP

    microservices:
      enabled: false
