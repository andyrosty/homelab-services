apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: nginx-ingress
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.12.0"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 1h

  values:
    controller:
      ingressClass: nginx

      ingressClassResource:
        name: nginx
        enabled: true
        default: false
        controllerValue: k8s.io/ingress-nginx

      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.50.240
