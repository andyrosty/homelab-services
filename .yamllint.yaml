extends: default

ignore: |
  clusters/homelab/flux-system/gotk-components.yaml
  clusters/homelab/flux-system/gotk-sync.yaml
  infrastructure/metallb/manifests/metallb-native.yaml

rules:
  line-length:
    max: 160
    level: warning

  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"

  comments:
    min-spaces-from-content: 1

  document-start: disable
