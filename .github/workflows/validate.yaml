name: Validate GitOps Manifests

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  schedule:
    - cron: "36 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  KUSTOMIZE_VERSION: ${{ vars.KUSTOMIZE_VERSION }}
  KUBECONFORM_VERSION: ${{ vars.KUBECONFORM_VERSION }}
  TRIVY_VERSION: ${{ vars.TRIVY_VERSION }}
  TRIVY_EXIT_CODE: "0"

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Lint YAML
        run: |
          yamllint .

  kustomize-build:
    name: Kustomize build (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs:
      - yaml-lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: homelab
            path: clusters/homelab
          - environment: staging
            path: clusters/staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          KUSTOMIZE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/"
          KUSTOMIZE_URL+="kustomize/v${KUSTOMIZE_VERSION}/"
          KUSTOMIZE_URL+="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"

          echo "Downloading: ${KUSTOMIZE_URL}"

          curl -fL "${KUSTOMIZE_URL}" -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Build ${{ matrix.environment }} manifests
        run: |
          mkdir -p /tmp/rendered
          kustomize build "${{ matrix.path }}" \
            > "/tmp/rendered/${{ matrix.environment }}.yaml"
          wc -l "/tmp/rendered/${{ matrix.environment }}.yaml"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.environment }}-manifests
          path: /tmp/rendered/${{ matrix.environment }}.yaml

  kubeconform:
    name: Kubernetes schema validation (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs:
      - kustomize-build

    strategy:
      fail-fast: false
      matrix:
        environment:
          - homelab
          - staging

    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-${{ matrix.environment }}-manifests
          path: /tmp/rendered

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.7"
          curl -fL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate ${{ matrix.environment }} Kubernetes schemas
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            "/tmp/rendered/${{ matrix.environment }}.yaml"

  trivy-config:
    name: Trivy config security scan
    runs-on: ubuntu-latest
    needs:
      - kustomize-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -fL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          file trivy.tar.gz
          tar -xzf trivy.tar.gz
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan Kubernetes manifests
        run: |
          set -euo pipefail

          mkdir -p reports

          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code "${TRIVY_EXIT_CODE}" \
            --skip-version-check \
            --skip-dirs infrastructure/metallb/manifests \
            --skip-dirs clusters/homelab/flux-system \
            --skip-dirs clusters/staging/flux-system \
            --format table \
            . | tee reports/trivy-config-reports.txt

          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --skip-version-check \
            --skip-dirs infrastructure/metallb/manifests \
            --skip-dirs clusters/homelab/flux-system \
            --skip-dirs clusters/staging/flux-system \
            --format json \
            --output reports/trivy-config-report.json \
            .

          echo "Created Trivy reports:"
          ls -lah reports/

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-reports
          path: reports/
          if-no-files-found: error
          retention-days: 7

  upload-report:
    name: Upload CI reports to Nexus
    runs-on: ubuntu-latest
    needs: trivy-config
    if: >
      github.ref_name == 'main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-*-manifests
          path: reports/rendered-manifests
          merge-multiple: true

      - name: Download Trivy reports
        uses: actions/download-artifact@v4
        with:
          name: trivy-config-reports
          path: reports/trivy

      - name: Generate sample report
        run: |
          mkdir -p reports
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Generated at: $(date -u)"
          } > reports/build-report.txt

          echo "CI bundle contents:"
          find reports -type f -print | sort

          tar -czf ci-report.tar.gz reports
          tar -tzf ci-report.tar.gz

      - name: Upload report to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          REPORT_PATH="${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/ci-report.tar.gz"

          curl --fail \
            --show-error \
            --silent \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file ci-report.tar.gz \
            "$NEXUS_URL/repository/raw-reports/$REPORT_PATH"

